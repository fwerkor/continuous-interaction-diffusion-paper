name: Temporary Figure 1 Regeneration

on:
  push:
    branches:
      - tmp/update-figure1-tools-sources

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned figure dependency
        run: python3 -m pip install --disable-pip-version-check matplotlib==3.10.9

      - name: Regenerate vector figures
        run: python3 scripts/draw_figures.py

      - name: Commit only Figure 1 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/cid-overview.pdf figures/cid-overview.svg
          if ! git diff --cached --quiet; then
            git commit -m "figures: regenerate overview label"
            git push
          fi
